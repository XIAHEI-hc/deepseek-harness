# Per-user DSH runtime overlay, applied by the platform supervisor with
# `dsh web --patch <this file>`.
#
# The legacy launch-token provider is disabled: no cookie, `?token=` URL, or
# legacy API credential may admit a browser into a platform runtime. The only
# admitted credential is the short-lived Ed25519 assertion the gateway signs for
# this instance's fixed subject and generation.
#
# Every value that varies per user comes from the environment the supervisor
# sets on the child process; nothing here is read from the browser.

- id: authentication-token
  disabled: true

- insert:
    - id: authentication-gateway
      name: '@deepseek-ai/dsh-host-authentication-gateway'
      config:
        algorithm: ed25519
        publicKeyFile: !!js process.env.DSH_GATEWAY_PUBLIC_KEY_FILE
        audience: !!js process.env.DSH_GATEWAY_AUDIENCE
        subject: !!js process.env.DSH_RUNTIME_SUBJECT
        issuer: !!js process.env.DSH_GATEWAY_ISSUER
        generation: !!js Number(process.env.DSH_RUNTIME_GENERATION)
        keyId: !!js process.env.DSH_GATEWAY_KEY_ID
        replayWindowSeconds: !!js Number(process.env.DSH_GATEWAY_REPLAY_WINDOW_SECONDS ?? '60')
        clockSkewSeconds: 30
        maxLifetimeSeconds: !!js Number(process.env.DSH_GATEWAY_MAX_LIFETIME_SECONDS ?? '300')

# Optional fusion tools. The base bundle keeps this row disabled; the platform
# enables it only when the supervisor injected both values. The capability is a
# short-lived HMAC token scoped to this runtime's user, not a platform secret.
- id: tool-integration
  disabled: false
  config:
    apiUrl: !!js process.env.DSH_INTEGRATION_API_URL
    capability: !!js process.env.DSH_INTEGRATION_CAPABILITY_TOKEN
    stateFile: !!js dshHomePath('state', 'fusion-sessions.json')

# Per-user full-text Session search. The shipped web profile keeps content
# search disabled; the platform enables one SQLite index under this user's own
# DSH home, so a user's search results are built only from that user's Sessions.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('state', 'session-query.sqlite')
    openAt: first-search
